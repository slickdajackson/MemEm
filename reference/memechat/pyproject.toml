[project]
name = "memechat"
version = "0.1.0"
description = "Chat where every message becomes a meme"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "qdrant-client>=1.15",
    "pyyaml>=6",
    "pydantic-settings>=2.4",
    "rapidfuzz>=3.9",
    "pillow>=11",
    "pyarrow>=17",
    "sentence-transformers>=6.1.0",
    "transformers>=5",
    "torch>=2.6",
    "torchvision",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memechat"]
