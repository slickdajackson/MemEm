<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meme Chat</title>
<style>
  :root {
    --bg: #f4f3ef; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6a66; --line: #dedcd5;
    --mine: #dff3e4; --theirs: #ffffff; --accent: #2f7d4f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --panel: #1f1f1d; --text: #ecebe6; --muted: #9b9a94; --line: #34332f;
            --mine: #1f3a2a; --theirs: #262624; --accent: #5cc285; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif;
         height: 100dvh; display: flex; flex-direction: column; }
  header { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line);
           background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 auto 0 0; }
  header label { color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; }
  header input { width: 120px; }
  input, button { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line);
                  border-radius: 8px; padding: 7px 10px; }
  button { background: var(--accent); color: #fff; border: none; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: min(420px, 85%); align-self: flex-start; background: var(--theirs); border: 1px solid var(--line);
         border-radius: 12px; padding: 8px; }
  .msg.mine { align-self: flex-end; background: var(--mine); }
  .msg .who { font-size: 12px; color: var(--muted); margin: 0 2px 6px; }
  .msg img { display: block; width: 100%; border-radius: 8px; cursor: pointer; }
  .msg details { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .msg details table { border-collapse: collapse; margin-top: 4px; }
  .msg details td { padding: 1px 6px 1px 0; }
  .pending { font-style: italic; color: var(--muted); }
  .error { color: #c0392b; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--panel); }
  form input { flex: 1; min-width: 0; }
  .empty { margin: auto; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Meme Chat</h1>
  <label>Name <input id="name" placeholder="dein Name"></label>
  <label>Raum <input id="room"></label>
</header>
<main id="log"><p class="empty">Schreib etwas – es kommt als Meme an.</p></main>
<form id="form">
  <input id="text" autocomplete="off" placeholder="Nachricht…" maxlength="500">
  <button id="send">Senden</button>
</form>
<script>
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { return localStorage.getItem(k) || d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
$("name").value = store.get("name", "");
$("room").value = location.hash.slice(1) || store.get("room", "lobby");
let lastTs = 0;
const seen = new Set();

$("name").onchange = () => store.set("name", $("name").value.trim());
$("room").onchange = () => {
  store.set("room", $("room").value.trim());
  location.hash = $("room").value.trim();
  $("log").innerHTML = ""; seen.clear(); lastTs = 0; poll();
};

function room() { return encodeURIComponent($("room").value.trim() || "lobby"); }

function render(m) {
  if (seen.has(m.id)) return;
  seen.add(m.id);
  $("log").querySelector(".empty")?.remove();
  const el = document.createElement("div");
  el.className = "msg" + (m.author === $("name").value.trim() ? " mine" : "");
  const rows = (m.debug.candidates || []).map(c =>
    `<tr><td>${c.template_id}</td><td>${c.score.toFixed(4)}</td><td>${
      Object.entries(c.kinds).map(([k, v]) => `${k} #${v.rank} (${v.score.toFixed(3)})`).join(", ")}</td></tr>`).join("");
  el.innerHTML = `<div class="who"></div><img alt=""><details><summary>Details</summary>
    <div class="orig"></div><div>Template: <b>${m.template_id}</b> – ${m.debug.template_name || ""}</div>
    <table>${rows}</table></details>`;
  el.querySelector(".who").textContent = m.author;
  el.querySelector("img").src = m.image_url;
  el.querySelector("img").alt = m.lines.filter(Boolean).join(" / ");
  el.querySelector(".orig").textContent = "Original: " + m.text;
  $("log").appendChild(el);
  $("log").scrollTop = $("log").scrollHeight;
  lastTs = Math.max(lastTs, m.created_at);
}

async function poll() {
  try {
    const r = await fetch(`/api/conversations/${room()}/messages?after=${lastTs}`);
    if (r.ok) (await r.json()).forEach(render);
  } catch {}
}
setInterval(poll, 2000);
poll();

$("form").onsubmit = async (e) => {
  e.preventDefault();
  const name = $("name").value.trim(), text = $("text").value.trim();
  if (!name) { $("name").focus(); return; }
  if (!text) return;
  store.set("name", name);
  $("text").value = ""; $("send").disabled = true;
  const pending = document.createElement("div");
  pending.className = "msg mine pending";
  pending.textContent = `„${text}“ wird zum Meme…`;
  $("log").querySelector(".empty")?.remove();
  $("log").appendChild(pending); $("log").scrollTop = $("log").scrollHeight;
  try {
    const r = await fetch(`/api/conversations/${room()}/messages`, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({author: name, text}),
    });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    pending.remove(); render(await r.json());
  } catch (err) {
    pending.classList.add("error"); pending.textContent = `Fehler: ${err.message}`;
  } finally { $("send").disabled = false; $("text").focus(); }
};
</script>
</body>
</html>
